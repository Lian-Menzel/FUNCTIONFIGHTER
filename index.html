<!doctype html>
<!--
  FUNCTION FIGHTER
  Einzelspieler: index.html einfach im Browser öffnen (Doppelklick).
  Multiplayer:   start.bat doppelklicken und den angezeigten Link öffnen.
  Für die schöne Formeldarstellung (MathJax) wird eine Internetverbindung
  benötigt – das Spiel selbst (samt Pixel-Schriften) läuft auch ohne.
-->
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Function Fighter</title>

  <link rel="stylesheet" href="fonts/fonts.css">
  <link rel="stylesheet" href="style.css">

  <!-- MathJax: nur für die Darstellung der Formeln -->
  <script>
    window.MathJax = {
      tex: { inlineMath: [['\\(', '\\)']] },
      svg: { fontCache: 'global' }
    };
  </script>
  <script async src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-svg.js"></script>

  <script defer src="script.js"></script>
  <script defer src="catalog.js"></script>
  <script defer src="multiplayer.js"></script>
</head>
<body>

  <header class="topbar">
    <h1 class="logo"><i data-icon="crest"></i><span>Function</span><em>Fighter</em></h1>
    <nav class="tabs" id="level-select" aria-label="Spielmodus"></nav>
    <div class="topbar-actions">
      <label class="name-field" title="Dein Name">
        <i data-icon="user"></i>
        <input id="player-name" maxlength="16" placeholder="Name" autocomplete="nickname" spellcheck="false">
      </label>
      <button class="btn btn-icon" id="newmap-btn" title="Neue Karte"><i data-icon="dice"></i></button>
      <button class="btn btn-icon" id="restart-btn" title="Neustart"><i data-icon="restart"></i></button>
      <button class="btn btn-icon" id="settings-btn" title="Einstellungen"><i data-icon="gear"></i></button>
    </div>
  </header>

  <main class="layout">

    <!-- Spielwelt + Eingabe darunter -->
    <section class="play">
      <div class="stage" id="stage">
        <div class="frame" id="frame"></div>
        <canvas id="game" aria-label="Spielfeld"></canvas>

        <div class="overlay" id="overlay" hidden>
          <div class="overlay-box">
            <h2 id="overlay-title"></h2>
            <p id="overlay-text"></p>
            <div class="overlay-buttons">
              <button class="btn" id="overlay-retry" title="Nochmal"><i data-icon="restart"></i></button>
              <button class="btn" id="overlay-newmap" title="Neue Karte"><i data-icon="dice"></i></button>
              <button class="btn btn-primary" id="overlay-next">Weiter <i data-icon="play"></i></button>
              <button class="btn btn-primary" id="overlay-lobby" hidden>Lobby</button>
            </div>
          </div>
        </div>
      </div>

      <div class="fire-bar" id="fire-bar">
        <button class="btn btn-icon" id="catalog-btn" title="Funktionen" hidden><i data-icon="chart"></i></button>
        <button class="btn btn-icon" id="keypad-btn" title="Mathe-Tasten"><i data-icon="keyboard"></i></button>
        <div class="fx-field">
          <select class="fx" id="fx-mode" title="Modus">
            <option value="y">f(x) =</option>
            <option value="y1">y′ =</option>
            <option value="y2">y″ =</option>
          </select>
          <input id="fx-input" type="text" maxlength="120" placeholder="x/2" aria-label="Funktion"
                 autocomplete="off" autocapitalize="off" spellcheck="false">
        </div>
        <div class="ode-controls" id="ode-controls" hidden>
          <label id="ode-angle-box" title="Startwinkel">∠ <input id="ode-angle" type="number" value="30" min="-85" max="85" step="5">°</label>
        </div>
        <div class="preview" id="preview" aria-live="polite"></div>
        <button class="btn btn-fire" id="fire-btn"><i data-icon="bolt"></i> FEUER</button>
      </div>
      <!-- Mathe-Tasten (fügen an der Cursor-Stelle ein) -->
      <div class="keypad" id="keypad" data-mode="y" hidden>
        <button type="button" data-ins="x">x</button>
        <button type="button" data-ins="y" class="ode-key">y</button>
        <button type="button" data-ins="y'" class="ode2-key">y′</button>
        <button type="button" data-ins="^2">x²</button>
        <button type="button" data-ins="^(|)">xⁿ</button>
        <button type="button" data-ins="/">÷</button>
        <button type="button" data-ins="sqrt(|)">√</button>
        <button type="button" data-ins="sin(|)">sin</button>
        <button type="button" data-ins="cos(|)">cos</button>
        <button type="button" data-ins="tan(|)">tan</button>
        <button type="button" data-ins="e^(|)">eˣ</button>
        <button type="button" data-ins="pi">π</button>
        <button type="button" data-ins="abs(|)">|x|</button>
        <button type="button" data-ins="(|)">( )</button>
        <button type="button" data-ins="+">+</button>
        <button type="button" data-ins="-">−</button>
        <button type="button" data-ins="*">·</button>
        <button type="button" data-key="dir" title="Nach links (L)">← L</button>
        <button type="button" data-key="back" title="Löschen">⌫</button>
        <button type="button" data-key="clear" title="Alles löschen">C</button>
      </div>
      <div class="bar-info">
        <span class="parse-status" id="parse-status"></span>
        <span class="message" id="message"></span>
      </div>
    </section>

    <!-- Seitenleiste -->
    <aside class="sidebar" id="sidebar">

      <div class="card level-card" id="level-card">
        <div class="level-num" id="level-num">LEVEL 1</div>
        <h2 id="level-name"></h2>
        <p class="level-task" id="level-task"></p>
        <p class="warning" id="level-warning" hidden></p>
        <div class="card-actions" id="tutorial-nav" hidden>
          <button class="btn btn-primary" id="tutorial-next">Weiter <i data-icon="play"></i></button>
          <button class="btn btn-small" id="tutorial-skip" title="Tutorial beenden"><i data-icon="close"></i></button>
        </div>
        <button class="btn btn-small walls-toggle" id="walls-toggle" title="Wände" hidden><i data-icon="wall"></i> AN</button>
        <div class="map-code" id="map-code" hidden>
          <i data-icon="key"></i><code id="map-code-text" title="Karten-Code"></code>
          <button class="btn btn-small" id="map-code-copy" title="Kopieren"><i data-icon="copy"></i></button>
          <button class="btn btn-small" id="map-code-edit" title="Bearbeiten" hidden><i data-icon="pencil"></i></button>
        </div>
        <div class="editor-tools" id="editor-tools" hidden>
          <div class="tool-row" id="editor-palette">
            <button type="button" class="tool" data-tool="wall" title="Wand"><i data-icon="wall"></i></button>
            <button type="button" class="tool" data-tool="1" title="Gegner 1"><i data-icon="slime"></i>1</button>
            <button type="button" class="tool" data-tool="2" title="Gegner 2"><i data-icon="slime"></i>2</button>
            <button type="button" class="tool" data-tool="3" title="Gegner 3"><i data-icon="slime"></i>3</button>
            <button type="button" class="tool" data-tool="player" title="Spieler"><i data-icon="user"></i></button>
            <button type="button" class="tool" data-tool="erase" title="Radierer"><i data-icon="eraser"></i></button>
          </div>
          <label class="editor-shots" title="Angriffe"><i data-icon="bolt"></i><input type="number" id="editor-shots" min="1" max="30" value="5"></label>
          <div class="card-actions">
            <button class="btn btn-primary btn-small" id="editor-test"><i data-icon="play"></i> Testen</button>
            <button class="btn btn-small" id="editor-copy" title="Code kopieren"><i data-icon="copy"></i></button>
            <button class="btn btn-small" id="editor-clear" title="Leeren"><i data-icon="eraser"></i></button>
          </div>
          <div class="editor-load">
            <input id="editor-code" placeholder="K1-…" autocomplete="off" spellcheck="false">
            <button class="btn btn-small" id="editor-load">Laden</button>
          </div>
          <p class="warning" id="editor-error"></p>
        </div>
      </div>

      <div class="card status">
        <div class="stat" title="Gegner">
          <i data-icon="slime"></i><span class="value" id="enemy-count">0</span>
        </div>
        <div class="stat" id="shot-item" title="Angriffe">
          <i data-icon="bolt"></i><span class="value" id="shot-count">0</span>
          <div class="pips" id="shot-pips"></div>
        </div>
        <div class="stat" id="score-item" title="Punkte · beste Kombo" hidden>
          <i data-icon="trophy"></i><span class="value" id="score">0</span><span class="record" id="best-combo"></span>
        </div>
      </div>

      <!-- Multiplayer: wer bin ich, wer ist dran, Leben aller Spieler -->
      <div class="card mp-card" id="mp-card">
        <div id="mp-card-head"></div>
        <div class="mp-status" id="mp-status"></div>
        <div id="mp-card-body"></div>
        <div class="card-actions">
          <button class="btn btn-small" id="mp-lobby-btn">Lobby</button>
          <button class="btn btn-small" id="mp-leave-btn">Verlassen</button>
        </div>
      </div>

      <!-- Funktionsliste (Tutorial, Sandkasten, Multiplayer wenn erlaubt) -->
      <div class="card catalog-card" id="catalog-card" hidden>
        <div class="catalog-head">
          <h2>Funktionen</h2>
          <button class="btn btn-small" id="catalog-close" title="Schließen"><i data-icon="close"></i></button>
        </div>
        <div class="catalog-list" id="catalog-list"></div>
      </div>

    </aside>
  </main>

  <!-- Level-Auswahl -->
  <dialog class="settings level-dialog" id="level-dialog">
    <form method="dialog">
      <button class="btn btn-small dlg-close" title="Schließen"><i data-icon="close"></i></button>
      <h2>Level</h2>
      <div class="level-grid" id="level-grid"></div>
      <div class="level-extra">
        <button type="button" class="btn btn-primary" id="daily-btn"><i data-icon="calendar"></i> Tages-Level <span class="daily-best" id="daily-best"></span></button>
        <button type="button" class="btn" id="editor-btn"><i data-icon="pencil"></i> Editor</button>
        <div class="code-row">
          <input id="code-input" class="code-input" placeholder="L3-1A2B3C" title="Karten-Code" autocomplete="off" spellcheck="false">
          <button type="button" class="btn" id="code-load" title="Karten-Code laden"><i data-icon="key"></i></button>
        </div>
      </div>
      <p class="warning" id="code-error"></p>
    </form>
  </dialog>

  <!-- Info: Schreibweise -->
  <dialog class="settings info-dialog" id="info-dialog">
    <form method="dialog">
      <button class="btn btn-small dlg-close" title="Schließen"><i data-icon="close"></i></button>
      <h2>Info</h2>
      <div class="rules-row">
        <span class="rule">\(y = f(x) - f(0)\)</span>
        <span class="rule"><code>L x^2</code> ← links</span>
        <span class="rule"><code>sin(4x)</code> max.</span>
        <span class="rule"><code>↑</code> <code>↓</code> Verlauf</span>
      </div>
      <div class="examples">
        <button type="button" class="example" data-input="x^2/3"><span>\(\frac{x^2}{3}\)</span><code>x^2/3</code></button>
        <button type="button" class="example" data-input="2x+1"><span>\(2x+1\)</span><code>2x+1</code></button>
        <button type="button" class="example" data-input="sqrt(x)"><span>\(\sqrt{x}\)</span><code>sqrt(x)</code></button>
        <button type="button" class="example" data-input="sqrt[3](x)"><span>\(\sqrt[3]{x}\)</span><code>sqrt[3](x)</code></button>
        <button type="button" class="example" data-input="1/(x+1)"><span>\(\frac{1}{x+1}\)</span><code>1/(x+1)</code></button>
        <button type="button" class="example" data-input="|x-3|"><span>\(|x-3|\)</span><code>|x-3|</code></button>
        <button type="button" class="example" data-input="e^(x/4)"><span>\(e^{x/4}\)</span><code>e^(x/4)</code></button>
        <button type="button" class="example" data-input="e^-x^2"><span>\(e^{-x^2}\)</span><code>e^-x^2</code></button>
        <button type="button" class="example" data-input="3sin(x/2)"><span>\(3\sin\left(\frac{x}{2}\right)\)</span><code>3sin(x/2)</code></button>
        <button type="button" class="example" data-input="cos(x)^2"><span>\(\cos^2 x\)</span><code>cos(x)^2</code></button>
        <button type="button" class="example" data-input="x(x-4)/3"><span>\(\frac{x(x-4)}{3}\)</span><code>x(x-4)/3</code></button>
        <button type="button" class="example" data-input="L x/2"><span>\(\leftarrow\ \frac{x}{2}\)</span><code>L x/2</code></button>
      </div>
    </form>
  </dialog>

  <!-- Multiplayer: Lobby erstellen / beitreten / Warteraum (Inhalt baut multiplayer.js) -->
  <dialog class="settings mp-dialog" id="mp-dialog">
    <div id="mp-dialog-body"></div>
  </dialog>

  <!-- Einstellungen -->
  <dialog class="settings" id="settings">
    <form method="dialog">
      <button class="btn btn-small dlg-close" title="Schließen"><i data-icon="close"></i></button>
      <h2>Einstellungen</h2>
      <fieldset class="group">
        <legend>Wände</legend>
        <label class="toggle"><input type="checkbox" id="walls-breakable" checked> zerstörbar</label>
        <label class="toggle"><input type="checkbox" id="endless-walls" checked> im Endlos-Modus</label>
      </fieldset>
      <div class="settings-actions">
        <button type="button" class="btn btn-small" id="all-on">Alle an</button>
        <button type="button" class="btn btn-small" id="all-off">Alle aus</button>
      </div>
      <div class="toggles" id="type-toggles"></div>
      <details class="matrix-box">
        <summary>Karte als Matrix</summary>
        <pre id="map-matrix"></pre>
      </details>
    </form>
  </dialog>

</body>
</html>
